fields:
  
  - id: LinguisticObject_Type
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformancePlan_Note_Type
    label: Type
    datatype: xsd:anyURI
    minOccurs: 1
    maxOccurs: 1
    queries:
      - select: 'SELECT ?value WHERE { $subject crm:P2_has_type ?value }'
      - insert: 'INSERT { $subject crm:P2_has_type ?value . } WHERE { }'
      - delete: 'DELETE { $subject crm:P2_has_type ?value . } WHERE { }'
      - valueSet: 'SELECT ?value WHERE { ?value skos:inScheme spav:eo . }'
    treePatterns: 
      type: full
      rootsQuery: 'SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:inScheme spav:eo ;
              skos:prefLabel ?label .
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          FILTER(NOT EXISTS { ?item skos:broader ?parent. })
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)          
        }
        ORDER BY (?label)'
      childrenQuery: '
        SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:broader ?parent.
          ?item (rdfs:label|skos:prefLabel|rdf:value|dc:title|rico:name|rico:identifier) ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      parentsQuery: '
        SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:broader ?parent.
          ?item (rdfs:label|skos:prefLabel|rdf:value|dc:title|rico:name|rico:identifier) ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      searchQuery: 'PREFIX lookup: <http://www.metaphacts.com/ontologies/platform/repository/lookup#>
        PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
        PREFIX Repository: <http://www.metaphacts.com/ontologies/repository#>
        SELECT DISTINCT ?item ?label ?score ?hasChildren WHERE {
        ?item skos:inScheme spav:eo ;
        skos:prefLabel ?label .
        FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
        ?label bds:search ?__token__ ; 
        bds:relevance ?score ; bds:matchAllTerms "true"
        OPTIONAL { ?child skos:broader ?item. }
        BIND(BOUND(?child) AS ?hasChildren)
      }
        ORDER BY DESC (?score) (?label)
        LIMIT 200' 
  
  - id: LinguisticObject_Value
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformancePlan_Note_Value
    label: Value
    datatype: xsd:string
    minOccurs: 1
    maxOccurs: 1
    queries:
      - select: 'SELECT ?value WHERE { $subject rdf:value ?value . }'
      - insert: 'INSERT { $subject rdf:value ?value . } WHERE { }'
      - delete: 'DELETE { $subject rdf:value ?value . } WHERE {}'
