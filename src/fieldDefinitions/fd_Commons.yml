  - id: Activity_CarriedOutBy
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/Activity_Actor
    label: Carried out by
    datatype: xsd:anyURI
    minOccurs: 1
    domain: http://www.cidoc-crm.org/cidoc-crm/E7_Activity
    range: http://www.cidoc-crm.org/cidoc-crm/E39_Actor
    queries:
      - select: 'SELECT ?value ?label WHERE {
        $subject crm:P14_carried_out_by ?value .
        ?value rdfs:label ?labelTmp .          
        BIND(IF(CONTAINS(STR(?value),"/u/"),CONCAT(?labelTmp,"  ","(unreconciled /u)"),?labelTmp) AS ?label)
      }'
      - insert: 'INSERT {
        $subject crm:P14_carried_out_by ?value.
      } WHERE {}'
      - autosuggestion: 'SELECT DISTINCT ?value ?label ?score WHERE {
        ?value rdf:type/rdfs:subClassOf* crm:E39_Actor ;
          crm:P131_is_identified_by [ rdf:value ?ll ] .
        
        BIND(SUBSTR(STR($value), 32 , 1 ) AS ?type_indicator)
        FILTER(?type_indicator = "a")
        
        SERVICE bds:search {
          ?ll bds:search ?__token__ ;
          bds:minRelevance "0.1" ;
          bds:relevance ?score ; 
          bds:matchAllTerms "true" .
        }

        ?value rdfs:label ?l .
        OPTIONAL {
          ?value crm:P3_has_note [
          crm:P2_has_type spav:eoept ;
          rdf:value ?note ]
        }
        BIND(IF(BOUND(?note), CONCAT(?l, " (", ?note, ")"), ?l) AS ?label)
      } ORDER BY DESC (?score)
      LIMIT 10' 

