  - id: PerformanceSingle_P2_has_type
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformanceSingle_P2_has_type
    label: Type
    datatype: xsd:anyURI
    domain: http://www.cidoc-crm.org/cidoc-crm/E7_Activity
    range: http://www.cidoc-crm.org/cidoc-crm/E55_Type
    documentation: ATTENTION, on prend seulement une sous-branche correspondant au types de perf. single
    queries:
      - select: 'SELECT ?value WHERE { $subject crm:P2_has_type $value. }'
      - insert: 'INSERT { $subject crm:P2_has_type $value . } WHERE {}'
      - autosuggestion: 'SELECT $value $label WHERE {
            $value skos:inScheme spav:hl ;
              skos:broader spav:hlsin ;
              skos:prefLabel ?label .
            FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__)) 
            ?label bds:search $__token__ ;
              bds:relevance ?score ; 
              bds:matchAllTerms "true"
          } LIMIT 10'
    treePatterns:
      type: full
      rootsQuery: 'SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:inScheme spav:hl ;
            skos:broader spav:hlsin ;
            skos:prefLabel ?label ;            
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))  
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      childrenQuery: '
        SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:broader ?parent.
          ?item (rdfs:label|skos:prefLabel|rdf:value|dc:title|rico:name|rico:identifier) ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__)) 
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      parentsQuery: '
        SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:broader ?parent.
          ?item (rdfs:label|skos:prefLabel|rdf:value|dc:title|rico:name|rico:identifier) ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__)) 
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      searchQuery: 'PREFIX lookup: <http://www.metaphacts.com/ontologies/platform/repository/lookup#>
        PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
        PREFIX Repository: <http://www.metaphacts.com/ontologies/repository#>
        SELECT DISTINCT ?item ?label ?score ?hasChildren WHERE {
        ?item skos:inScheme spav:hl ;
          skos:broader+ spav:hlsin ;
          skos:prefLabel ?label .
        FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__)) 
        ?label bds:search ?__token__ ; 
        bds:relevance ?score ; bds:matchAllTerms "true"
        OPTIONAL { ?child skos:broader ?item. }
        BIND(BOUND(?child) AS ?hasChildren)
      }
        ORDER BY DESC (?score) (?label)
        LIMIT 200'

  - id: PerformanceSingle_P4_has_time_span_E52TimeSpanValue
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformanceSingle_P4_has_time_span_E52TimeSpanValue
    label: Date Value
    datatype: xsd:date
    minOccurs: 1
    maxOccurs: 1
    queries:
      - select: 'SELECT ?value WHERE {                
                  $subject crm:P4_has_time-span ?newUri .
                  ?newUri crm:P82a_begin_of_the_begin ?value . 
                }'
      - insert: 'INSERT { 
                    $subject crm:P4_has_time-span ?newUri .
                    ?newUri rdf:type crm:E52_Time-Span .
                    ?newUri crm:P82a_begin_of_the_begin $value . 
                    ?newUri crm:P82b_end_of_the_end $value .
                    ?newUri rdfs:label ?dateString .
                    $subject rdfs:label ?dateStringSingle .
                  } WHERE {
                    $subject crm:P4_has_time-span ?hasTIME .
                    BIND(IF(BOUND(?hasTIME),IRI(CONCAT(STR($subject),"/date")),?hasTIME) AS ?newUri)
                    BIND(STR($value) as ?dateString)
                    BIND(CONCAT("Performance on the ",STR($value)) as ?dateStringSingle)
                  }'
      - delete: 'DELETE {
          $subject crm:P4_has_time-span ?newUri .
          ?newUri rdf:type crm:E52_Time-Span .
          ?newUri crm:P82a_begin_of_the_begin $value . 
          ?newUri crm:P82b_end_of_the_end $value .
          ?newUri rdfs:label ?dateString .
          $subject rdfs:label ?dateStringSingle .
        } WHERE {}'

  - id: PerformanceSingle_Title_Label
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformanceSingle_Title_Label
    label: Title
    datatype: http://www.w3.org/2001/XMLSchema#string
    minOccurs: 1
    maxOccurs: 1
    queries:
      - select: 'SELECT ?value WHERE { $subject rdf:value ?value . }'
      - insert: 'INSERT { 
                    $subject rdf:value $value . 
                    ?parent rdfs:label $value . 
                } WHERE { 
                  BIND(IRI(REPLACE(STR($subject),"/title","")) AS ?parent)
                }'
      - delete: 'DELETE { 
                $subject rdf:value $value . 
                ?parent rdfs:label $value . 
              } 
              WHERE { 
                BIND(IRI(REPLACE(STR($subject),"/title","")) AS ?parent)
              }'

