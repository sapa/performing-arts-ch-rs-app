fields:
 
  
  #********************************************************
  #          Record
  #********************************************************

  - id: Rico_hasDocumentaryFormType
    label: Documentary Form Type
    datatype: xsd:anyURI
    queries:
      - select: 'SELECT ?value WHERE { $subject rico:hasDocumentaryFormType ?value . }'
      - insert: 'INSERT { $subject rico:hasDocumentaryFormType $value . } WHERE {}'
      - delete: 'DELETE { $subject rico:hasDocumentaryFormType $value . } WHERE {}'

  - id: Rico_recordResourceSourceOfInformation
    label: Record Resource
    datatype: xsd:anyURI
    minOccurs: 1
    queries:
      - select: 'SELECT ?value WHERE { $subject rico:recordResourceSourceOfInformation ?value . }'
      - insert: 'INSERT { $subject rico:recordResourceSourceOfInformation $value . } WHERE {}'
      - delete: 'DELETE { $subject rico:recordResourceSourceOfInformation $value . } WHERE {}'
      - autosuggestion: '
            SELECT DISTINCT $value ?label
            WHERE {
              $value a ?typeRecordOfValue ;
                    rico:name ?label .
              VALUES (?typeRecordOfValue) {
                (rico:Record)
                (rico:RecordSet)
              }
              FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
              ?label bds:search ?__token__ ;
              bds:relevance ?score ; 
              bds:matchAllTerms "true"
            }LIMIT 100'
    treePatterns:
      type: full
      rootsQuery: 'SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item a ?typeofRecord .
          FILTER(NOT EXISTS { ?item rico:isOrWasIncludedIn ?parent. })
          ?item rico:name ?label.
          
          OPTIONAL { ?child rico:isOrWasIncludedIn ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
          VALUES (?typeofRecord) { 
            (rico:Record) 
            (rico:RecordSet)  
          }
        }
        ORDER BY (?label)'
      parentsQuery: 'SELECT DISTINCT ?item ?parent ?parentLabel WHERE {
          ?item rico:isOrWasIncludedIn ?parent.
          ?parent rico:name ?parentLabel.
          
        }'
      childrenQuery: 'SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item rico:isOrWasIncludedIn ?parent.
          ?item rico:name ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          OPTIONAL { ?child rico:isOrWasIncludedIn ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      searchQuery: 'SELECT DISTINCT ?item ?label ?score ?hasChildren WHERE {
        {
          ?item a ?typeRecordOfValue ;
            rico:name ?label .
          VALUES (?typeRecordOfValue) {
            (rico:Record)
            (rico:RecordSet)
          }
          ?label bds:search ?__token__ ;
            bds:relevance ?score ; 
            bds:matchAllTerms "true"
        } UNION {
          BIND(URI(REPLACE(?__token__, "[\\\\\\\\|*]", "")) AS ?item)
          ?item a ?typeRecordOfValue ;
            rico:name ?label .
          VALUES (?typeRecordOfValue) {
            (rico:Record)
            (rico:RecordSet)
          }
        }
        
        OPTIONAL { ?child rico:isOrWasIncludedIn ?item. }
        BIND(BOUND(?child) AS ?hasChildren)
      } ORDER BY ASC (?label)'

  - id: RecordNote
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/ThingNote
    label: Note
    datatype: http://www.w3.org/2001/XMLSchema#string
    domain: https://www.ica.org/standards/RiC/ontology#RecordResource
    queries:
      - select: 'SELECT $value WHERE { $subject spao:hasNote $value. }'
      - insert: 'INSERT { $subject spao:hasNote $value. } WHERE { }'
      - delete: 'DELETE { $subject spao:hasNote $value. } WHERE { }'

