fields:
 
  - id: ExpressionCreation_PerformancePlan_R17_created
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/ExpressionCreation_PerformancePlan_R17_created
    datatype: xsd:anyURI
    minOccurs: 1
    maxOccurs: 1
    domain: frbroo:F28_Expression_Creation
    queries:
      - select: 'SELECT $value WHERE { $value frbroo:R17_created $subject }'
      - insert: 'INSERT { $value frbroo:R17_created $subject } WHERE {}'
      - delete: 'DELETE { $value frbroo:R17_created $subject } WHERE {}'

  - id: ExpressionCreation_PP_PerformanceWork
