fields:
 
  - id: PerformancePlan_MusicTitle
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/MusicTitle
    label: Has music title
    datatype: xsd:langString
    queries:
      - select: 'SELECT $value WHERE { $subject spao:hasMusicTitle $value }'
      - insert: 'INSERT { $subject spao:hasMusicTitle $value } WHERE {}'
      - delete: 'DELETE { $subject spao:hasMusicTitle $value } WHERE {}'

  - id: PerformancePlan_R14_incorporates
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformancePlan_R14_incorporates
    label: Incorporates
    datatype: xsd:anyURI
    queries:
      - select: 'SELECT $value WHERE { $subject frbroo:R14_incorporates $value }'
      - insert: 'INSERT { $subject frbroo:R14_incorporates $value } WHERE {}'
      - delete: 'DELETE { $subject frbroo:R14_incorporates $value } WHERE {}'
      - autosuggestion: 'SELECT ?value ?label
          WHERE {
            ?value a frbroo:F22_Self-Contained_Expression ;
                  rdfs:label ?labelTmp .
            ?F28_EC frbroo:R17_created ?value .
            ?F28_EC a frbroo:F28_Expression_Creation .
            ?F28_EC crm:P9_consists_of ?activiy .
            ?activiy crm:P2_has_type ?voc_type .
            OPTIONAL {
              Select ?voc_type (CONCAT("(",?typeActivityLabel,": ",GROUP_CONCAT(DISTINCT ?agents;separator=", "),")") AS ?TypeOfActivities)
              Where {
                ?voc_type skos:inScheme ?inScheme ;
                          skos:prefLabel ?typeActivityLabel .
                ?voc_type skos:narrower ?child .
                ?child rdf:type skos:Concept .
                ?child skos:prefLabel ?agents .                
              }
              GROUP BY ?voc_type ?typeActivityLabel
            }
            BIND(IF(BOUND(?voc_type),CONCAT(?labelTmp," ",?TypeOfActivities),?labelTmp) AS ?label)
            FILTER(regex(str(?value),"/u/", "i"))
            ?label bds:search $__token__ ;
                bds:relevance ?score ; 
                bds:matchAllTerms "true" .
          } limit 10' 

  - id: PerformancePlan_Title_Label_Value
    iri: http://performing-arts.ch/ldp-assets/fieldDefinitionContainer/PerformancePlan__TitleLabel_Value
    label: Title
    datatype: xsd:langString
    minOccurs: 1
    maxOccurs: 1
    queries:
      - select: 'SELECT ?value WHERE {       
          $subject rdf:value ?value .          
        }'
      - insert: 'INSERT { $subject rdf:value $value . 
                          ?parent rdfs:label $value . }
                  WHERE { 
                  BIND(IRI(REPLACE(STR($subject),"/title","")) AS ?parent)
                  }'
      - delete: 'DELETE { $subject rdf:value $value . } WHERE { }'

  - id: PerformancePlan_RDFSLabel
