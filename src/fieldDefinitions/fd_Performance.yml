  - id: PerformanceSerie_P10_falls_within
    label: Season
    minOccurs: 1
    maxOccurs: 1
    datatype: xsd:anyURI
    domain: http://iflastandards.info/ns/fr/frbr/frbroo/F25_Performance_Plan
    range: http://www.cidoc-crm.org/cidoc-crm/E4_Period
    queries:
      - select: 'SELECT ?value ?label WHERE { $subject crm:P10_falls_within ?value . }'
      - insert: 'INSERT { $subject crm:P10_falls_within ?value . } WHERE {} '
      - delete: 'DELETE { $subject crm:P10_falls_within ?value . } WHERE {} '
      - autosuggestion: 'SELECT DISTINCT $value $label WHERE {
            ?value a crm:E4_Period  .
            ?value rdfs:label ?searchedLabel .
            FILTER(contains(str(?value),"/s/"))
            ?searchedLabel bds:search $__token__ ;
              bds:relevance ?score ; 
              bds:matchAllTerms "true" .
            ?value rdfs:label ?label . FILTER(lang(?label) = "en")
          } LIMIT 10'

