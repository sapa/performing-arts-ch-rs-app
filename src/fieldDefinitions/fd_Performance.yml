  - id: PerformanceSerie_P2_has_type
    label: Type
    datatype: xsd:anyURI
    domain: http://www.cidoc-crm.org/cidoc-crm/E7_Activity
    range: http://www.cidoc-crm.org/cidoc-crm/E55_Type
    documentation: ATTENTION, on prend seulement une sous-branche correspondant au types de perf. série
    queries:
      - select: 'SELECT ?value WHERE { $subject crm:P2_has_type $value. }'
      - insert: 'INSERT { $subject crm:P2_has_type $value . } WHERE {}'
      - autosuggestion: 'SELECT $value $label WHERE {
            $value skos:inScheme spav:hl ;
              skos:broader+ spav:hlser ;
              skos:prefLabel ?label .
            FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
            ?label bds:search $__token__ ;
              bds:relevance ?score ; 
              bds:matchAllTerms "true" .
          } LIMIT 10'
    treePatterns:
      type: full
      rootsQuery: 'SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:inScheme spav:hl ;
            skos:broader+ spav:hlser ;
            skos:prefLabel ?label .
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      childrenQuery: '
        SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:broader ?parent.
          ?item (rdfs:label|skos:prefLabel|rdf:value|dc:title|rico:name|rico:identifier) ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      parentsQuery: '
        SELECT DISTINCT ?item ?label ?hasChildren WHERE {
          ?item skos:broader ?parent.
          ?item (rdfs:label|skos:prefLabel|rdf:value|dc:title|rico:name|rico:identifier) ?label.
          FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
          OPTIONAL { ?child skos:broader ?item. }
          BIND(BOUND(?child) AS ?hasChildren)
        }
        ORDER BY (?label)'
      searchQuery: 'PREFIX lookup: <http://www.metaphacts.com/ontologies/platform/repository/lookup#>
        PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
        PREFIX Repository: <http://www.metaphacts.com/ontologies/repository#>
        SELECT DISTINCT ?item ?label ?score ?hasChildren WHERE {
        ?item skos:inScheme spav:hl ;
          skos:broader+ spav:hlser ;
          skos:prefLabel ?label .
        FILTER(LANGMATCHES(LANG(?label), ?__userPreferredLanguage__))
        ?label bds:search ?__token__ ; 
        bds:relevance ?score ; bds:matchAllTerms "true"
        OPTIONAL { ?child skos:broader ?item. }
        BIND(BOUND(?child) AS ?hasChildren)
      }
        ORDER BY DESC (?score) (?label)
        LIMIT 200'  

  - id: PerformanceSerie_R25_performed
    iri: "https://www.sapa.swiss/en"
    label: Performed
    minOccurs: 1
    maxOccurs: 1
    datatype: xsd:anyURI
    domain: frbroo:R25_performed
    queries:
      - select: 'SELECT ?value WHERE { $subject frbroo:R25_performed $value }'
      - insert: 'INSERT { $subject frbroo:R25_performed ?value. } WHERE {}'
      - delete: 'DELETE { $subject frbroo:R25_performed ?value. } WHERE {}'
      - autosuggestion: 'SELECT DISTINCT ?value ?label ?score WHERE {

          ?value a frbroo:F25_Performance_Plan ;
            crm:P102_has_title [ rdf:value ?ll ] .
          SERVICE bds:search {
            ?ll bds:search ?__token__ ;
            bds:minRelevance "0.1" ;
            bds:relevance ?score ; 
            bds:matchAllTerms "true" .
          }

        ?value rdfs:label ?l .
        
        OPTIONAL {
          SELECT ?value (GROUP_CONCAT(?producer) AS ?producers)
          WHERE {
            ?value ^frbroo:R17_created/crm:P9_consists_of ?activity .
            ?activity crm:P2_has_type spav:muwgo .
            ?activity crm:P14_carried_out_by/rdfs:label ?producer .
          }
          GROUP BY ?value
        }

        OPTIONAL {
          SELECT ?value (GROUP_CONCAT(?director) AS ?directors)
          WHERE {
            ?value ^frbroo:R17_created/crm:P9_consists_of ?activity .
            ?activity crm:P2_has_type spav:mutnt .
            ?activity crm:P14_carried_out_by/rdfs:label ?director .
          }
          GROUP BY ?value
        }

        BIND(IF(BOUND(?producers) || BOUND(?directors), CONCAT(?l, " ("), ?l) AS ?l1)
        BIND(IF(BOUND(?producers), CONCAT(?l1, "production ", ?producers), ?l1) AS ?l2)
        BIND(IF(BOUND(?producers) && BOUND(?directors), CONCAT(?l2, ", "), ?l2) AS ?l3)
        BIND(IF(BOUND(?directors), CONCAT(?l3, "direction ", ?directors), ?l3) AS ?l4)
        BIND(IF(BOUND(?producers) || BOUND(?directors), CONCAT(?l4, ")"), ?l4) AS ?l5)

        BIND(CONCAT(?l5, " - ...", SUBSTR(STR(?value), STRLEN("http://data.performing-arts.ch/w/")+30)) AS ?label)

      } ORDER BY DESC (?score) ?label
      LIMIT 30'

  - id: PerformanceSerie_P8_took_place_on_or_within
    label: took place on or within
    datatype: xsd:anyURI
    domain: frbroo:F31_Performance
    range: crm:E22_Man-Made_Object
    queries:
      - select: 'SELECT ?value 
                 WHERE { 
                    $subject crm:P8_took_place_on_or_within ?value. 
                    ?value rdfs:label ?labelTmp .
                    BIND(IF(CONTAINS(STR(?value),"/u/"),CONCAT(?labelTmp,"  ","(unreconciled /u)"),?labelTmp) AS ?label)
                }'
      - insert: 'INSERT { $subject crm:P8_took_place_on_or_within $value. } WHERE {}'
      - delete: 'DELETE { $subject crm:P8_took_place_on_or_within $value. } WHERE {}'
      - autosuggestion: 'SELECT DISTINCT ?value ?label WHERE {
          ?value a crm:E22_Man-Made_Object .
          ?value crm:P2_has_type ?type .
          ?type skos:inScheme <http://vocab.performing-arts.ch/dw> .

          {
            ?value rdfs:label ?l .            
          }
          UNION
          {
            ?value crm:P102_has_title/rdf:value ?l .            
          }

          SERVICE bds:search {
            ?l bds:search ?__token__ ;
            bds:minRelevance "0.1" ;
            bds:relevance ?score ; 
            bds:matchAllTerms "true" .
          }
          
          OPTIONAL {
            SELECT ?value (GROUP_CONCAT(DISTINCT ?venue2Label) AS ?venue2Title)
            WHERE {
              ?venue2 a crm:E22_Man-Made_Object .
              ?venue2 crm:P46_is_composed_of ?value .
              ?venue2 crm:P2_has_type ?type .
              ?type skos:inScheme <http://vocab.performing-arts.ch/dw> .

              {
                ?venue2 rdfs:label ?venue2Label .
              }
              UNION {
                ?venue2 crm:P102_has_title/rdf:value ?venue2Label .
              }
            } GROUP BY ?value
          }
        
          BIND(IF(BOUND(?venue2Title), CONCAT(?l, " ("), ?l) AS ?l1)
          BIND(IF(BOUND(?venue2Title), CONCAT(?l1, "composed ", ?venue2Title), ?l1) AS ?l2)
          BIND(IF(BOUND(?venue2Title), CONCAT(?l2, ")"), ?l2) AS ?l3)
          
          BIND(CONCAT(?l3, " - ...", SUBSTR(STR(?value), STRLEN("http://data.performing-arts.ch/o/")+30)) AS ?label)

        } LIMIT 10'

