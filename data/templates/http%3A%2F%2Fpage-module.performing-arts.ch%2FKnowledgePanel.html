<div class="sari-page-header">
    <div class="sari-page-header-thumbnail">
        <mp-resource-thumbnail iri='[[this]]'></mp-resource-thumbnail>
    </div>
    <div class="sari-page-header-content">
        <h1>
            <mp-label iri='[[this]]'></mp-label>
        </h1>

        <!--Description -->
        <p>
            <semantic-query
                query="SELECT ?description ?desc_name WHERE {
                    ?? a ?class .
                    FILTER(CONTAINS(STR(?class), 'RiC') || CONTAINS(STR(?class), 'frbroo'))
                    OPTIONAL { ?? crm:P2_has_type ?crmtype . }
                    OPTIONAL { ?? crm:P4_has_time-span ?timespan . }
                    OPTIONAL {
                        ?work frbroo:R12_is_realised_in ?? ;
                            crm:P2_has_type ?genre .
                    }
                    OPTIONAL { ?? rico:hasRecordSetType ?record_set_type . }
                    BIND(IF(BOUND(?timespan), ?timespan, IF(BOUND(?genre), ?genre, IF(BOUND(?crmtype), ?crmtype, IF(BOUND(?record_set_type), ?record_set_type, ?class)))) AS ?description)
                    BIND(STRAFTER(STR(?description),'frbroo/') AS ?desc_name)
                }"
                template='{{#each bindings}}[[> addComma]]
                    {{#if (eq description.value "http://iflastandards.info/ns/fr/frbr/frbroo/F22_Self-Contained_Expression") }}
                        <span>[[i18n "F22_Self-Contained_Expression" bundle="performing-arts-ch"]]</span>                        
                    {{else}}
                        <mp-label iri="{{description.value}}"></mp-label>
                    {{/if}}
                {{/each}}'>
            </semantic-query>
        </p>

        <p class="knowledge-panel__uri" style="margin-top: 10px;">
            <b>URI</b>:
            <a href='[[this]]' style="font-size: 12px; text-decoration: underline;" target='_blank'>
                <span>[[this]]</span>
            </a>
            <mp-copy-to-clipboard text='[[this]]'>
                <button class='btn btn-link btn-sm knowledge-panel__uri-copy-button'>
                    <i class='fa fa-clipboard'></i>
                </button>
            </mp-copy-to-clipboard>
        </p>

        <!--Types -->
        <p>
            <b>Type</b>: <semantic-query
                query="SELECT DISTINCT ?type WHERE { <[[this]]> [[#if type]][[type]][[else]]a[[/if]] ?type }"
                style="display:inline;"></semantic-query>
        </p>

        <!--Image Source -->
        <semantic-query 
            query='SELECT ?value WHERE {
                ?? a crm:E21_Person; 
                owl:sameAs ?wikiId . 
                SERVICE <https://query.wikidata.org/sparql> {
                    ?wikiId wdt:P18 ?wikimedia_image_raw . 
                FILTER (STRSTARTS(str(?wikiId), "http://www.wikidata.org/entity/"))
                }
                BIND(REPLACE(STR(?wikimedia_image_raw), "%3A", ":") as ?wikimedia_image)
                BIND(CONCAT("https://commons.wikimedia.org/wiki/File:", STRAFTER(STR(?wikimedia_image), "FilePath/")) as ?value) 
            } LIMIT 1'
            template="{{> image-source-template}}">
            <template id="image-source-template">
                <p>
                    {{#each bindings}}<b>Image Source</b>: <a href='{{value.value}}' target='_blank'><i> Wikimedia Commons </i> </a>{{/each}}
                </p>
            </template>
        </semantic-query>
    </div>
</div>

[[#*inline "addComma"]]{{#if @first}}{{else}}, {{/if}}[[/inline]]
