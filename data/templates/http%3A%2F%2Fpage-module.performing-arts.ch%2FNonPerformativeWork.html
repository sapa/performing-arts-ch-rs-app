[[> sapaModule:FieldDefinitions]]

<div data-flex-layout='row top-stretch'>
  <semantic-form 
    [[#if create]]
      new-subject-template='http://data.performing-arts.ch/u/{{UUID}}'
      post-action="redirect"
    [[else]]
      subject='[[this]]'
      post-action="reload"
    [[/if]]
    
    browser-persistence=true
    persistence='ldp' 
    form-id='nonPerformativeWork'
    fields='[
      [[> RDFtype]],        
      [[> Non_Performative_Expression_Label]],
      [[> SameAs]],
      [[> Non_Performative_Expression_P102_has_title]],      
      [[> ExpressionCreation_NPE_frbroo_R17_created]]      
    ]'>

    <bs-panel>
      <semantic-form-recover-notification></semantic-form-recover-notification>
      <div style="display: none;">
        <semantic-form-hidden-input for="RDFtype" default-value='[[resolvePrefix "frbroo:F22_Self-Contained_Expression"]]'></semantic-form-hidden-input>
      </div>      
      
      <!-- Label -->
      <semantic-form-text-input for="Non_Performative_Expression_Label" languages='["en","de","it","fr"]' ></semantic-form-text-input>
      <!-- SameAs -->
      <semantic-form-text-input for="SameAs"></semantic-form-text-input>
      <!-- Title -->
      <semantic-form-composite-input for="Non_Performative_Expression_P102_has_title"
        new-subject-template='/title'
        fields='[
          [[> RDFtype]],
          [[> TitleType]],
          [[> TitleValue]]
        ]'
      >
        <div style="display: none;">
          <semantic-form-hidden-input for="RDFtype" default-value='[[resolvePrefix "crm:E35_Title"]]'></semantic-form-hidden-input>
        </div>
        <bs-row>
          <bs-col sm='2'>
            <semantic-form-tree-picker-input for="TitleType"></semantic-form-tree-picker-input>
          </bs-col>
          <bs-col sm='10'>
            <semantic-form-text-input for="TitleValue" languages='["en","de","it","fr"]' ></semantic-form-text-input>
          </bs-col>
        </bs-row>
      </semantic-form-composite-input>
      <hr/>
      <!-- #######################"" Expression Creation #######################" -->
      <semantic-form-composite-input for="ExpressionCreation_NPE_frbroo_R17_created"
        new-subject-template='/creation'
        fields='[
          [[> RDFtype]],
          [[> ExpressionCreation_NPE_frbroo_ConsistOf]]
        ]'
      >
        <div style="display: none;">
          <semantic-form-hidden-input for="RDFtype" default-value='[[resolvePrefix "frbroo:F28_Expression_Creation"]]'></semantic-form-hidden-input>              
        </div>
        <!-- ConsistOf to Activity -->
        <bs-row>
          <semantic-form-composite-input for="ExpressionCreation_NPE_frbroo_ConsistOf"
            new-subject-template='http://data.performing-arts.ch/x/{{UUID}}'
            fields='[
              [[> RDFtype]],
              [[> Activity_HasType]],
              [[> Activity_AdditionalType]],
              [[> ExpressionCreation_NPE_frbroo_P14_carried_out_by]],
              [[> Activity_Certainty]],
              [[> RDFSComment]]            
            ]'>
            <div style="display: none;">
              <semantic-form-hidden-input for="RDFtype" default-value='[[resolvePrefix "crm:E7_Activity"]]'></semantic-form-hidden-input>
            </div>
            <bs-row>
              <bs-col sm='2'>
                <!-- Activity Type -->
                <semantic-form-tree-picker-input for="Activity_HasType"></semantic-form-tree-picker-input>
              </bs-col>
              <bs-col sm='2'>
                <!-- Additional Type -->
                <semantic-form-tree-picker-input for="Activity_AdditionalType"></semantic-form-tree-picker-input>
              </bs-col>              
              <!-- Carried out by  -->
              <bs-col sm='2'>
                <semantic-form-autocomplete-input for="ExpressionCreation_NPE_frbroo_P14_carried_out_by" placeholder='Search persons...'></semantic-form-autocomplete-input>
              </bs-col>
              <!-- certainty -->
              <bs-col sm='2'>
                <semantic-form-checklist-input row=true for="Activity_Certainty"></semantic-form-checklist-input>
              </bs-col>
            </bs-row> 
            <bs-row>
              <!-- Comment -->
              <bs-col sm='10'>
                <semantic-form-text-input for="RDFSComment" languages='["en","de","it","fr"]' ></semantic-form-text-input>
              </bs-col>
            </bs-row>
          </semantic-form-composite-input>
        </bs-row>        
      </semantic-form-composite-input>   

      <semantic-form-errors></semantic-form-errors>
      <br/>
      <button name="submit" class="btn btn-secondary">[[i18n "FormSubmit" bundle="performing-arts-ch"]]</button>
      <button name="reset" class="btn btn-secondary">[[i18n "FormReset" bundle="performing-arts-ch"]]</button>
    </bs-panel>
  </semantic-form>

 
</div>
